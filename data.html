<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Añadir Dato · Curious Data RNG</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #0d1a14 0%, #050a08 60%, #000 100%);
      color: #00ff9d;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 32px 16px 60px;
      display: flex; justify-content: center;
    }
    .container { width: 100%; max-width: 720px; }
    h1 {
      font-weight: 300; letter-spacing: 3px; font-size: 1.5rem;
      margin-bottom: 6px; text-shadow: 0 0 20px rgba(0, 255, 157, 0.5);
    }
    .subtitle { opacity: 0.55; font-size: 0.85rem; margin-bottom: 28px; }
    label {
      display: block; font-size: 0.8rem; letter-spacing: 1px;
      opacity: 0.85; margin-bottom: 6px; margin-top: 18px;
    }
    input, textarea {
      width: 100%; background: rgba(0, 255, 157, 0.04);
      border: 1.5px solid rgba(0, 255, 157, 0.35); color: #00ff9d;
      padding: 12px 14px; border-radius: 8px; font-size: 0.95rem;
      font-family: inherit; outline: none;
    }
    input:focus, textarea:focus {
      border-color: #00ff9d; box-shadow: 0 0 0 3px rgba(0, 255, 157, 0.12);
    }
    textarea { min-height: 110px; resize: vertical; }
    .sections-area { margin-top: 28px; }
    .sections-area > .head {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
    }
    .sections-area > .head span { font-size: 0.8rem; letter-spacing: 1px; opacity: 0.85; }
    .section-card {
      border: 1.5px solid rgba(0, 255, 157, 0.3); border-radius: 10px;
      padding: 14px; margin-bottom: 14px; background: rgba(0, 255, 157, 0.03);
    }
    .section-card .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .section-card .row input { flex: 1; }
    .bullets { display: flex; flex-direction: column; gap: 8px; }
    .bullet-row { display: flex; gap: 8px; align-items: flex-start; }
    .bullet-row textarea { flex: 1; min-height: 52px; font-size: 0.9rem; }
    .btn {
      padding: 8px 14px; background: transparent; border: 1.5px solid #00ff9d;
      color: #00ff9d; border-radius: 8px; cursor: pointer; font-size: 0.85rem;
      letter-spacing: 0.5px; transition: all 0.2s; white-space: nowrap;
    }
    .btn:hover { background: rgba(0, 255, 157, 0.12); }
    .btn-danger { border-color: rgba(255, 90, 90, 0.55); color: #ff7a7a; min-width: 40px; padding: 8px 10px; }
    .btn-danger:hover { background: rgba(255, 80, 80, 0.12); }
    .btn-small { font-size: 0.8rem; padding: 6px 12px; margin-top: 8px; }
    .btn-primary {
      width: 100%; margin-top: 28px; padding: 16px; font-size: 1rem; font-weight: 600;
      letter-spacing: 2px; background: rgba(0, 255, 157, 0.1); border: 2px solid #00ff9d;
    }
    .btn-primary:hover { background: rgba(0, 255, 157, 0.18); }
    .info {
      margin-top: 24px; padding: 14px; border: 1px solid rgba(0, 255, 157, 0.22);
      border-radius: 10px; background: rgba(0, 255, 157, 0.04);
      font-size: 0.82rem; line-height: 1.5; opacity: 0.8;
    }
    .info strong { color: #7dffc4; }
    code { background: rgba(0, 255, 157, 0.1); padding: 1px 5px; border-radius: 4px; }
    .meta {
      margin-top: 12px; font-size: 0.8rem; opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Añadir Dato</h1>
    <p class="subtitle">Curious Data RNG · Los datos se cifran con AES-128 en data.json</p>
    <div id="mode-banner" style="
      margin-bottom:18px; padding:12px 14px; border-radius:8px; font-size:0.85rem; line-height:1.45;
      border:1px solid rgba(0,255,157,0.3); background:rgba(0,255,157,0.06);"></div>

    <label>Título</label>
    <input id="title" type="text" placeholder="Ej: La Saliva Humana">

    <label>Descripción (hecho principal)</label>
    <textarea id="fact" placeholder="Texto introductorio del dato..."></textarea>

    <label>Tag (categoría)</label>
    <input id="tag" type="text" placeholder="Biología, Astronomía, Física...">

    <div class="sections-area">
      <div class="head">
        <span>SECCIONES</span>
        <button class="btn" type="button" onclick="addSection()">+ Añadir sección</button>
      </div>
      <div id="sections-root"></div>
    </div>

    <button class="btn btn-primary" type="button" id="save-btn" onclick="saveData()">GUARDAR Y DESCARGAR data.json</button>
    <p class="meta" id="count-meta"></p>

    <div class="info" id="info-box">
      <strong>Cifrado:</strong> AES-128-GCM · un solo archivo <code>data.json</code> binario.<br>
      Si se modifica el archivo, index.html no podrá descifrarlo y se bloqueará.
    </div>
  </div>

  <script>
    const AES_PASSWORD = "CuriousData2026Oscar!";
    let sections = [{ title: '', bullets: [''] }];
    let allData = [];

    function isLocalMode() {
      return location.protocol === 'file:';
    }

    function initModeUI() {
      const local = isLocalMode();
      const banner = document.getElementById('mode-banner');
      const btn = document.getElementById('save-btn');
      if (local) {
        banner.innerHTML = '<strong>Modo local</strong><br>Al guardar se descargará <code>data.json</code>. Luego cárgalo manualmente en index.html con el botón de carga.';
        if (btn) btn.textContent = 'GUARDAR Y DESCARGAR data.json';
      } else {
        banner.innerHTML = '<strong>Modo GitHub / servidor</strong><br>Al guardar se descarga <code>data.json</code> cifrado. Súbelo a <code>data/data.json</code> en tu repositorio (reemplaza el anterior). index.html lo leerá solo automáticamente.';
        if (btn) btn.textContent = 'CIFRAR Y DESCARGAR data.json (subir a data/)';
      }
    }

    // Load existing from localStorage (working copy while editing)
    try {
      const saved = localStorage.getItem('curiousDataPlain');
      if (saved) {
        allData = JSON.parse(saved);
        document.getElementById('count-meta').textContent =
          'Datos en borrador local: ' + allData.length + ' (se incluirán en el archivo cifrado)';
      }
    } catch (e) {}

    async function deriveKey(password) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: enc.encode("curious-data-salt-v2"),
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 128 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptPayload(obj) {
      const key = await deriveKey(AES_PASSWORD);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const plaintext = new TextEncoder().encode(JSON.stringify(obj));
      const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, plaintext);
      const result = new Uint8Array(iv.length + ciphertext.byteLength);
      result.set(iv, 0);
      result.set(new Uint8Array(ciphertext), iv.length);
      return result;
    }

    function renderSections() {
      const root = document.getElementById('sections-root');
      root.innerHTML = '';
      sections.forEach((sec, sIdx) => {
        const card = document.createElement('div');
        card.className = 'section-card';

        const row = document.createElement('div');
        row.className = 'row';
        const titleInput = document.createElement('input');
        titleInput.type = 'text';
        titleInput.placeholder = 'Título de la sección';
        titleInput.value = sec.title;
        titleInput.oninput = (e) => { sections[sIdx].title = e.target.value; };
        const btnRemoveSec = document.createElement('button');
        btnRemoveSec.className = 'btn btn-danger';
        btnRemoveSec.type = 'button';
        btnRemoveSec.textContent = '×';
        btnRemoveSec.onclick = () => {
          sections.splice(sIdx, 1);
          if (!sections.length) sections = [{ title: '', bullets: [''] }];
          renderSections();
        };
        row.appendChild(titleInput);
        row.appendChild(btnRemoveSec);
        card.appendChild(row);

        const bulletsDiv = document.createElement('div');
        bulletsDiv.className = 'bullets';
        sec.bullets.forEach((b, bIdx) => {
          const brow = document.createElement('div');
          brow.className = 'bullet-row';
          const ta = document.createElement('textarea');
          ta.placeholder = 'Viñeta ' + (bIdx + 1);
          ta.value = b;
          ta.oninput = (e) => { sections[sIdx].bullets[bIdx] = e.target.value; };
          const btnRemoveB = document.createElement('button');
          btnRemoveB.className = 'btn btn-danger';
          btnRemoveB.type = 'button';
          btnRemoveB.textContent = '×';
          btnRemoveB.onclick = () => {
            sections[sIdx].bullets.splice(bIdx, 1);
            if (!sections[sIdx].bullets.length) sections[sIdx].bullets = [''];
            renderSections();
          };
          brow.appendChild(ta);
          brow.appendChild(btnRemoveB);
          bulletsDiv.appendChild(brow);
        });
        card.appendChild(bulletsDiv);

        const btnAddBullet = document.createElement('button');
        btnAddBullet.className = 'btn btn-small';
        btnAddBullet.type = 'button';
        btnAddBullet.textContent = '+ Viñeta';
        btnAddBullet.onclick = () => { sections[sIdx].bullets.push(''); renderSections(); };
        card.appendChild(btnAddBullet);
        root.appendChild(card);
      });
    }

    function addSection() {
      sections.push({ title: '', bullets: [''] });
      renderSections();
    }

    function downloadBlob(filename, data, mime) {
      const blob = new Blob([data], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    async function saveData() {
      const title = document.getElementById('title').value.trim();
      const fact  = document.getElementById('fact').value.trim();
      const tag   = document.getElementById('tag').value.trim();
      if (!title || !fact || !tag) {
        alert('Completa Título, Descripción y Tag.');
        return;
      }

      const cleanSections = sections
        .map(s => ({
          title: s.title.trim(),
          bullets: s.bullets.map(b => b.trim()).filter(Boolean)
        }))
        .filter(s => s.title && s.bullets.length);

      if (!cleanSections.length) {
        alert('Añade al menos una sección con título y viñetas.');
        return;
      }

      const key = 'K' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 8).toUpperCase();

      allData.push({ title, fact, sections: cleanSections, tags: [tag], key });
      localStorage.setItem('curiousDataPlain', JSON.stringify(allData));

      try {
        const encrypted = await encryptPayload(allData);
        downloadBlob('data.json', encrypted, 'application/octet-stream');
        alert(isLocalMode()
          ? ('✅ Cifrado (AES-128)\n\nDatos: ' + allData.length + '\n\nSe descargó data.json\nEn index.html usa: Cargar data.json cifrado')
          : ('✅ Cifrado (AES-128)\n\nDatos: ' + allData.length + '\n\nSe descargó data.json\nSúbelo a data/data.json en GitHub (reemplaza el anterior)\nindex.html lo cargará solo')
        );
      } catch (err) {
        console.error(err);
        alert('Error al cifrar: ' + err.message);
        return;
      }

      document.getElementById('title').value = '';
      document.getElementById('fact').value = '';
      document.getElementById('tag').value = '';
      sections = [{ title: '', bullets: [''] }];
      renderSections();
      document.getElementById('count-meta').textContent =
        'Datos en borrador local: ' + allData.length + ' (se incluirán en el archivo cifrado)';
    }

    renderSections();
    initModeUI();
  </script>
</body>
</html>
